version: '3.8'

services:
  scrollingweb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bosu-portfolio
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
